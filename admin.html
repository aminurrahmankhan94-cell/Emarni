<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMARNI Admin</title>
  <link rel="stylesheet" href="style.css?v=9" />
  <style>
    /* EMARNI Admin — red / black / white design system (standalone page) */
    :root {
      --red:#EF4444; --red-deep:#DC2626; --red-soft:#F87171;
      --black:#050505; --surface:#101010; --elevated:#181818;
      --white:#FFFFFF; --muted:#A3A3A3; --border:rgba(255,255,255,0.09);
      --bg:var(--black); --bg-2:#0A0A0A; --panel:var(--surface); --panel-2:var(--elevated);
      --text:#F5F5F5; --text-dim:#A3A3A3; --text-faint:#6B6B6B;
      --ok:#22C55E; --warn:#FBBF24; --danger:#EF4444;
      --radius:18px; --radius-sm:12px; --radius-pill:999px;
      --shadow:0 18px 50px rgba(0,0,0,0.45); --ease:cubic-bezier(0.2,0.8,0.2,1);
      --font-head:"Space Grotesk",system-ui,sans-serif; --font-body:"Hind Siliguri",system-ui,sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: var(--bg);
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(239,68,68,.12), transparent 60%);
      color: var(--text);
      font-family: var(--font-body);
    }
    .brand-mark {
      font-family: var(--font-head); font-weight: 700; letter-spacing: .18em;
      color: var(--white); font-size: 22px;
    }
    .brand-mark span { color: var(--red); }
    /* Login */
    .auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth .card {
      background: var(--panel); border: 1px solid var(--border);
      border-top: 3px solid var(--red);
      border-radius: var(--radius); padding: 32px 28px; width: 100%; max-width: 400px;
      box-shadow: var(--shadow);
    }
    .auth h2 {
      font-family: var(--font-head); margin: 0 0 4px; font-size: 24px; color: var(--white);
      display: flex; align-items: center; gap: 10px;
    }
    .auth h2 svg { width: 22px; height: 22px; color: var(--red); }
    .auth .hint { color: var(--text-dim); font-size: 13px; margin: 0 0 18px; }
    .auth input {
      width: 100%; padding: 12px 14px; margin-bottom: 12px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
      font-family: var(--font-body); outline: none; transition: border-color .18s var(--ease);
    }
    .auth input:focus { border-color: var(--red); }
    .auth .btn {
      width: 100%; padding: 12px; background: var(--red); color: var(--white);
      border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: var(--font-body); transition: background .18s var(--ease);
    }
    .auth .btn:hover { background: var(--red-deep); }
    .error { color: var(--red-soft); font-size: 13px; margin: 10px 0 0; min-height: 18px; }
    .link {
      background: none; border: none; color: var(--red-soft); cursor: pointer;
      font-size: 13px; text-decoration: none; font-family: var(--font-body);
      display: block; margin-top: 12px; text-align: center;
    }
    .link:hover { text-decoration: underline; }
    .hidden { display: none !important; }
    /* Admin panel */
    .admin { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
    .admin-top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-wrap: wrap; margin-bottom: 20px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .admin-top h1 {
      font-family: var(--font-head); font-size: 26px; margin: 0; color: var(--white);
      display: flex; align-items: center; gap: 10px;
    }
    .admin-top h1 svg { width: 24px; height: 24px; color: var(--red); }
    .admin-top .links { display: flex; gap: 16px; align-items: center; }
    .admin-top .link { margin: 0; display: inline; }
    /* Tabs */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab {
      background: none; border: none; cursor: pointer;
      color: var(--text-dim); font-family: var(--font-body);
      font-size: 14px; font-weight: 600; padding: 10px 20px;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color .18s var(--ease), border-color .18s var(--ease);
    }
    .tab:hover { color: var(--text); }
    .tab.on { color: var(--red); border-bottom-color: var(--red); }
    .tab #repCount { color: var(--red); font-weight: 700; margin-left: 4px; }
    /* Panel / tables */
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; overflow-x: auto; }
    .admin-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .summary-card {
      background: var(--panel-2); border: 1px solid var(--border);
      border-left: 3px solid var(--red); border-radius: var(--radius-sm);
      padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
    }
    .summary-card span { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; }
    .summary-card strong { font-size: 24px; font-family: var(--font-head); color: var(--white); }
    .admin-search {
      width: 100%; padding: 11px 14px; margin-bottom: 16px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
      font-family: var(--font-body); outline: none;
    }
    .admin-search:focus { border-color: var(--red); }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th {
      text-align: left; padding: 10px 12px; color: var(--text-faint);
      font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
      border-bottom: 1px solid var(--border); font-weight: 600;
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-dim); vertical-align: top; }
    tr.click { cursor: pointer; transition: background .15s var(--ease); }
    tr.click:hover { background: rgba(239,68,68,.06); }
    tr.click:hover td { color: var(--text); }
    .tag {
      display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill);
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    }
    .tag.open { background: rgba(239,68,68,.15); color: var(--red-soft); border: 1px solid rgba(239,68,68,.3); }
    .tag.resolved { background: rgba(34,197,94,.12); color: var(--ok); border: 1px solid rgba(34,197,94,.3); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn.sm {
      padding: 6px 12px; font-size: 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      cursor: pointer; font-family: var(--font-body); transition: all .15s var(--ease);
    }
    .btn.sm:hover { border-color: var(--red); color: var(--red-soft); }
    .hint { color: var(--text-faint); font-size: 12.5px; }
    .empty-state { text-align: center; padding: 30px; color: var(--text-faint); }
    .reset-note { background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.25); padding: 10px 12px; border-radius: var(--radius-sm); font-size: 12.5px; color: var(--warn); }
    .list { list-style: none; padding: 0; margin: 8px 0; }
    .list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .list .grow { flex: 1; }
    .list .none { color: var(--text-faint); border: none; }
    /* Dialog */
    dialog {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); padding: 24px;
      max-width: 640px; width: 92vw; max-height: 85vh; overflow-y: auto;
      box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(4px); }
    dialog h3 { font-family: var(--font-head); margin: 0 0 14px; color: var(--white); font-size: 18px; }
    dialog p { color: var(--text-dim); font-size: 13.5px; margin: 6px 0; }
    dialog .convo {
      max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px;
    }
    .msg {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 8px 12px; max-width: 85%; align-self: flex-start;
    }
    .msg.mine { align-self: flex-end; border-left: 3px solid var(--red); }
    .msg.gone-admin { opacity: .55; border-style: dashed; }
    .msg small { display: block; color: var(--red-soft); font-size: 11px; margin-bottom: 3px; }
    .msg span { display: block; color: var(--text); font-size: 13.5px; word-break: break-word; }
    .msg time { display: block; color: var(--text-faint); font-size: 10.5px; margin-top: 4px; }
    .empty { color: var(--text-faint); text-align: center; padding: 20px; }
    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--panel); border: 1px solid var(--red); border-left: 4px solid var(--red);
      color: var(--text); padding: 12px 20px; border-radius: var(--radius-sm);
      font-size: 13.5px; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
      transition: opacity .25s var(--ease), transform .25s var(--ease); z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <!-- Admin sign in -->
  <main class="auth" id="login">
    <form class="card" id="loginForm">
      <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>EMARNI <span style="color:var(--red)">Admin</span></h2>
      <p class="hint">Sign in with an admin account. All actions are logged.</p>
      <input id="email" type="email" placeholder="Admin email" required autocomplete="username" />
      <input id="password" type="password" placeholder="Password" required autocomplete="current-password" />
      <button class="btn">Sign in</button>
      <p class="error" id="loginError"></p>
      <button class="link hidden" id="copyUid" type="button">Copy my UID</button>
      <button class="link hidden" id="loginOut" type="button">Sign out and use another account</button>
      <a class="link" href="index.html">← Back to Emarni</a>
    </form>
  </main>

  <!-- Admin panel -->
  <div class="admin hidden" id="admin">
    <div class="admin-top">
      <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>EMARNI Admin Panel</h1>
      <div class="links">
        <a class="link" href="index.html">← Back to chat</a>
        <button class="link" id="out" type="button">Sign out</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" data-t="users" type="button">Users</button>
      <button class="tab" data-t="reports" type="button">Reports <span id="repCount"></span></button>
      <button class="tab" data-t="deleted" type="button">Deleted (30 days)</button>
    </div>
    <div class="panel" id="view"></div>
  </div>

  <dialog id="dlg" class="wide">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div class="row"><button class="btn sm" id="dlgClose" type="button">Close</button></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="admin.js?v=9"></script>
</body>
</html>
